<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>BrieflyBot</title>

  <style>
    /* =====================
       ROOT / CANVAS
    ====================== */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      /* ❌ NO BLUE, NO CYAN */
      background:
        radial-gradient(1200px 600px at 15% -20%, rgba(180, 180, 200, 0.12), transparent 60%),
        radial-gradient(1000px 500px at 85% 10%, rgba(160, 160, 180, 0.10), transparent 55%),
        radial-gradient(800px 400px at 50% 120%, rgba(140, 140, 160, 0.12), transparent 60%),
        #05060a;

      color: #e5e7eb;
    }


    /* =====================
       FLOATING FRAME
    ====================== */
    .frame {
      position: absolute;
      inset: 16px;
      border-radius: 28px;
      /* ⬅️ MORE ROUNDED */
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.10),
          rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 40px 120px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* ⬅️ IMPORTANT for rounded corners */
    }

    /* =====================
       HEADER
    ====================== */
    .header {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      /* Neutral glass — NO color bias */
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.02));

      backdrop-filter: blur(16px);

      /* Subtle separation without a hard edge */
      box-shadow:
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);

      -webkit-app-region: drag;
    }

    .header {
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
    }


    .title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }

    .window-controls {
      display: flex;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .window-controls button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .window-controls button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
    }

    /* =====================
       CONTENT AREA
    ====================== */
    .content {
      flex: 1;
      padding: 16px;
      overflow: hidden;
    }

    .scroll {
      height: 100%;
      overflow-y: auto;
      padding-right: 8px;
    }

    /* Custom scrollbar */
    .scroll::-webkit-scrollbar {
      width: 6px;
    }

    .scroll::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: linear-gradient(180deg, #60a5fa, #22d3ee);
    }

    .scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    /* =====================
       CARDS (ANTI-GRAVITY)
    ====================== */
    .card {
      margin-bottom: 14px;
      padding: 14px 16px;
      border-radius: 16px;

      background:
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.04));

      border: 1px solid rgba(255, 255, 255, 0.16);

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

      animation: floatIn 0.5s ease;
    }


    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      opacity: 0.95;
    }

    .card-body {
      font-size: 13px;
      line-height: 1.45;
      opacity: 0.85;
    }

    .card-list {
      margin: 0;
      padding-left: 18px;
      list-style: none;
    }

    .card-list li {
      position: relative;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0.85;
    }

    /* Custom bullet */
    .card-list li::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d1d5db, #9ca3af);
      opacity: 0.9;
    }


    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="header">
      <div class="title">BrieflyBot</div>
      <div class="window-controls">
        <button id="minimize">—</button>
        <button id="close">✕</button>
      </div>
    </div>

    <div class="content">
      <div class="scroll" id="messages"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
